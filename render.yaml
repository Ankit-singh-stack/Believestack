services:
  - type: web
    name: believe-stack-api
    runtime: node
    region: oregon
    plan: starter
    rootDir: server
    buildCommand: npm install
    preDeployCommand: npm run db && npm run seed
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: believestack
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: BELIEVE STACK Admin
      - key: CONTACT_EMAIL
        value: belivestack1316@gmail.com
      - key: MAIL_FROM
        value: belivestack1316@gmail.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
